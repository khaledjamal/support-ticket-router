[project]
name = "support-ticket-router"
version = "0.1.0"
description = "Sorts customer support tickets automatically and sends the uncertain ones to a person."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "typesafe-sdk>=0.7.2,<0.8",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "ruff>=0.8",
]
docs = [
    "playwright>=1.48",
]

[project.scripts]
triage-seed = "triage.seed:main"
triage-tickets = "triage.reports:tickets_main"
triage-policies = "triage.reports:policies_main"
triage-bench = "triage.bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = [
    "E501",  # the formatter owns line length; long string literals are fine
    "RUF001",  # en dashes in user-facing text are intentional
]
