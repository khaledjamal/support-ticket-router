<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Support Ticket Router{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.11/dist/htmx.min.js"
          integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg"
          crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #f7f7f5; --panel: #fff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e4e4e0;
      --auto: #1f7a4d; --auto-bg: #e3f3ea; --review: #8a5a00; --review-bg: #fbf0d9;
      --human: #a1262b; --human-bg: #f9e2e3; --accent: #3651d4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141416; --panel: #1d1d20; --ink: #ececef; --muted: #9a9aa2; --line: #2e2e33;
        --auto: #6fd39d; --auto-bg: #173326; --review: #f0c46a; --review-bg: #3a2e14;
        --human: #f08a8e; --human-bg: #3d1a1c; --accent: #8fa2ff;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, sans-serif; }
    main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
    header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 20px; }
    h1 { font-size: 20px; margin: 0; }
    h2 { font-size: 15px; margin: 0 0 12px; }
    .muted { color: var(--muted); }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
    .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2.4fr); gap: 16px; align-items: start; }
    @media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(108px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .stat .value { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .stat .label { color: var(--muted); font-size: 12px; }
    form label { display: block; font-weight: 500; margin: 10px 0 4px; }
    input, textarea { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 6px;
                      background: var(--bg); color: var(--ink); font: inherit; }
    textarea { min-height: 120px; resize: vertical; }
    button { margin-top: 12px; padding: 8px 14px; border: 0; border-radius: 6px; background: var(--accent);
             color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button[disabled] { opacity: .6; }
    .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .filters a { padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink); text-decoration: none; }
    .filters a.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 12px; color: var(--muted); font-weight: 500; }
    td.subject { min-width: 220px; }
    td.subject .reason { font-size: 12px; color: var(--muted); }
    .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .route-auto { color: var(--auto); background: var(--auto-bg); }
    .route-review { color: var(--review); background: var(--review-bg); }
    .route-human { color: var(--human); background: var(--human-bg); }
    .risk { color: var(--human); font-weight: 600; font-size: 12px; }
    .conf { color: var(--muted); font-size: 12px; }
    .badge.audit { color: var(--accent); background: transparent; border: 1px solid var(--accent); }
    .intro { max-width: 70ch; }
    select { padding: 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
    .review-card { margin-bottom: 12px; }
    .review-card h2 { margin: 8px 0 4px; }
    .review-card .body { margin: 0 0 12px; white-space: pre-wrap; }
    .review-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
    .fields { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; }
    .fields label { margin: 0; display: flex; flex-direction: column; gap: 4px; }
    .fields button { margin: 0; }
    .reviewed { padding: 10px 16px; }
    .ok { color: var(--auto); }
    .wrong { color: var(--human); }
    tr.fresh { animation: fresh 2s ease-out; }
    @keyframes fresh { from { background: var(--auto-bg); } to { background: transparent; } }
    .htmx-request button { opacity: .6; }
  </style>
</head>
<body>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
